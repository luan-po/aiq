<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIQ</title>
<style>
  :root {
    --ground:#0e0f11;
    --surface:#15171b;
    --raised:#1b1e23;
    --line:#23272e;
    --ink:#e8e8e6;
    --dim:#8a8f98;
    --accent:#2f6fed;
    --accent-ink:#ffffff;
    --r:8px;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--ground); color:var(--ink);
    font:400 14px/1.55 "Segoe UI", -apple-system, "Microsoft YaHei", sans-serif;
    display:flex; overflow:hidden;
  }
  ::selection { background:#2f6fed33; }

  /* 左栏 */
  #side { width:236px; flex:0 0 236px; background:var(--surface); display:flex; flex-direction:column; }
  #side h1 { font-size:15px; font-weight:600; margin:0; padding:18px 18px 14px; }
  #groups { flex:1; overflow-y:auto; padding:0 8px 8px; }
  .g { padding:9px 10px; border-radius:var(--r); cursor:pointer; }
  .g:hover { background:var(--raised); }
  .g.active { background:var(--raised); box-shadow:inset 2px 0 0 var(--accent); }
  .g .name { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .g .meta { font-size:11px; color:var(--dim); margin-top:2px; }
  #emptyGroups { color:var(--dim); font-size:11px; padding:8px 10px; }
  #newGroup { display:none; gap:8px; padding:12px 10px 14px; background:var(--surface); }
  #newGroup input { flex:1; min-width:0; }
  #aiHint { color:var(--dim); font-size:11px; line-height:1.7; padding:2px 2px 0; }

  /* 中部 */
  #main { flex:1; min-width:0; display:flex; flex-direction:column; }
  #head { padding:16px 22px; display:flex; align-items:baseline; gap:10px; }
  #head b { font-size:15px; font-weight:600; }
  #head span { font-size:11px; color:var(--dim); }
  #msgs { flex:1; overflow-y:auto; padding:6px 22px 18px; display:flex; flex-direction:column; }
  #emptyChat { margin:auto; text-align:center; color:var(--dim); }
  #emptyChat b { display:block; color:var(--ink); font-size:20px; font-weight:600; margin-bottom:6px; }

  .m { max-width:76%; margin-top:14px; align-self:flex-start; }
  .m.first { margin-top:18px; }
  .m .who { font-size:11px; color:var(--dim); margin:0 0 4px 2px; }
  .m .body { background:var(--raised); padding:9px 13px; border-radius:var(--r); white-space:pre-wrap; word-break:break-word; }
  .m.me { align-self:flex-end; }
  .m.me .body { background:#1b2a45; }
  .m.bot .body { background:#20242c; box-shadow:inset 2px 0 0 #4a5160; }
  .m.bot .who { color:#a9b0bd; }
  .m .at { font-size:11px; color:#5f646d; margin:3px 2px 0; }
  .m.me .at { text-align:right; }

  #compose { display:none; gap:8px; padding:12px 22px 18px; align-items:flex-end; }
  #compose textarea {
    flex:1; resize:none; min-height:40px; max-height:150px; padding:10px 12px;
    background:var(--surface); color:var(--ink); border:0; border-radius:var(--r);
    font:inherit; line-height:1.5;
  }
  #compose textarea:focus { outline:2px solid #2f6fed55; }

  /* 通用控件 */
  input, textarea { font:inherit; }
  input { padding:9px 11px; border:0; border-radius:var(--r); background:var(--surface); color:var(--ink); width:100%; }
  input:focus { outline:2px solid #2f6fed55; }
  button { font:inherit; padding:9px 14px; border:0; border-radius:var(--r); background:var(--accent); color:var(--accent-ink); cursor:pointer; }
  button:hover { background:#3a7bf5; }
  button.flat { background:var(--raised); color:var(--ink); }
  button.flat:hover { background:#252932; }
  button.tiny { padding:5px 10px; font-size:11px; }
  ::-webkit-scrollbar { width:10px; }
  ::-webkit-scrollbar-thumb { background:#2a2e36; border-radius:5px; }
  ::-webkit-scrollbar-track { background:transparent; }

  /* 右栏 AI */
  #ai { width:340px; flex:0 0 340px; background:var(--surface); display:flex; flex-direction:column; }
  #ai header { padding:16px 16px 12px; display:flex; justify-content:space-between; align-items:center; }
  #ai header b { font-size:15px; font-weight:600; }
  #aiCfg { display:none; flex-direction:column; gap:8px; padding:0 16px 14px; }
  #aiBody { flex:1; overflow-y:auto; padding:4px 16px 12px; display:flex; flex-direction:column; gap:10px; }
  .q { display:flex; flex-wrap:wrap; gap:6px; padding:10px 16px; }
  .q button { background:var(--raised); color:var(--ink); font-size:11px; padding:6px 10px; }
  .ans { background:var(--raised); border-radius:var(--r); padding:11px 13px; white-space:pre-wrap; font-size:13px; }
  .meq { color:var(--dim); font-size:11px; text-align:right; }
  #aiAskRow { display:flex; gap:8px; padding:0 16px 16px; }
  #aiAskRow input { flex:1; }

  /* 登录 */
  #login { position:fixed; inset:0; background:var(--ground); display:flex; align-items:center; justify-content:center; }
  #login .box { width:340px; display:flex; flex-direction:column; gap:10px; }
  #login h2 { margin:0 0 6px; font-size:28px; font-weight:600; letter-spacing:-.5px; }
  .hint { color:var(--dim); font-size:11px; }
</style>
</head>
<body>

<div id="side">
  <h1>AIQ</h1>
  <div id="groups"><div id="emptyGroups">还没有群</div></div>
  <div id="newGroup">
    <input id="groupName" placeholder="新群名">
    <button id="createGroup">建</button>
  </div>
</div>

<div id="main">
  <div id="head"><b>未加入群</b><span></span></div>
  <div id="msgs">
    <div id="emptyChat"><b>选一个群开始</b>或者在左下角建一个新的</div>
  </div>
  <div id="compose">
    <textarea id="text" rows="1" placeholder="输入消息，或按 Shift+Enter 换行"></textarea>
    <button id="send">发送</button>
  </div>
</div>

<div id="ai">
  <header><b>AI 助手</b><button id="cfgBtn" class="flat tiny">设置</button></header>
  <div id="aiCfg">
    <input id="apiKey" placeholder="API Key（sk-...）" type="password">
    <input id="baseUrl" placeholder="接口地址">
    <input id="model" placeholder="模型名">
    <button id="saveCfg">保存</button>
    <div class="hint">key 只存在本机，不上传</div>
  </div>
  <div id="aiBody"><div id="aiHint">选中一个群，点下面的按钮，或者直接问我。<br>我会读最近 10 条群聊。</div></div>
  <div class="q">
    <button data-p="总结一下大家刚才聊了什么">总结群聊</button>
    <button data-p="刚才谁说了什么，简单列一下">谁说了啥</button>
    <button data-p="帮我想一句自然的接话">帮接一句</button>
  </div>
  <div id="aiAskRow">
    <input id="aiPrompt" placeholder="问 AI…">
    <button id="aiAsk">问</button>
  </div>
</div>

<div id="login">
  <div class="box">
    <h2>进 AIQ</h2>
    <input id="name" placeholder="你的名字">
    <input id="server" placeholder="服务器地址（留空=本机）">
    <button id="go">进去</button>
    <div class="hint" id="lanHint"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let me = null, ws = null, current = null, lastSeq = 0;
let lastWho = '', lastTs = 0;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clock = ts => {
  const d = new Date(ts || Date.now());
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
};

async function api(path, body) {
  const r = await fetch(path, body ? { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) } : {});
  return r.json();
}

async function enter() {
  const name = $('#name').value.trim();
  if (!name) return;

  // 填了别的服务器地址：直接跳过去（同一个服务器 = 同一个群）
  const srv = $('#server').value.trim().replace(/\/+$/, '');
  if (srv && srv !== location.origin) {
    localStorage.setItem('aiq_server', srv);
    location.href = srv + '/';
    return;
  }

  const saved = localStorage.getItem('aiq_token');
  let u = saved ? await api('/api/login', { token: saved }) : null;
  if (!u || u.error) u = await api('/api/register', { name });
  if (u.error) { alert(u.error); return; }
  me = u; localStorage.setItem('aiq_token', u.token);
  $('#login').style.display = 'none';
  $('#newGroup').style.display = 'flex';
  await loadGroups(); await loadCfg(); connect();
}

async function showLan() {
  try {
    const r = await api('/api/net');
    $('#lanHint').textContent = r.ips && r.ips.length
      ? `局域网：http://${r.ips[0]}:${r.port}（朋友填这个）`
      : '没检测到局域网 IP';
  } catch {}
}
showLan();
$('#server').value = localStorage.getItem('aiq_server') || '';

async function loadGroups() {
  const r = await api(`/api/groups?token=${me.token}`);
  const box = $('#groups');
  const list = r.groups || [];
  box.innerHTML = list.length ? '' : '<div id="emptyGroups">还没有群</div>';
  list.forEach(g => {
    const el = document.createElement('div');
    el.className = 'g' + (current === g.id ? ' active' : '');
    el.innerHTML = `<div class="name">${esc(g.name)}</div><div class="meta">${g.members} 人</div>`;
    el.onclick = () => openGroup(g.id, g.name);
    box.appendChild(el);
  });
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?token=${me.token}`);
  ws.onopen = () => { if (current) ws.send(JSON.stringify({ type:'join', groupId: current })); };
  ws.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.type === 'joined') { pullHistory(); }
    if (d.type === 'msg' && d.groupId === current) render(d.message, d.fromName);
  };
  ws.onclose = () => setTimeout(connect, 1500);
}

async function openGroup(id, name) {
  current = id; lastSeq = 0; lastWho = ''; lastTs = 0;
  $('#head').innerHTML = `<b>${esc(name)}</b><span></span>`;
  $('#msgs').innerHTML = '';
  $('#compose').style.display = 'flex';
  await api('/api/join', { token: me.token, groupId: id });
  ws.send(JSON.stringify({ type:'join', groupId: id }));
  await pullHistory(); loadGroups();
}

async function pullHistory() {
  const r = await api(`/api/history?token=${me.token}&groupId=${current}&since=${lastSeq}`);
  (r.messages || []).forEach(m => render(m));
  lastSeq = Math.max(lastSeq, Number(r.lastSeq) || 0);
}

function render(m, fromName) {
  if (!m || m.seq <= lastSeq) return;
  lastSeq = m.seq;

  const mine = m.from === me.id;
  const who = m.from === 'ai-assistant' ? 'AI 助手'
            : (m.kind === 'bot' ? 'AI' : (mine ? me.name : (m.name || fromName || m.from)));

  const el = document.createElement('div');
  el.className = 'm' + (mine ? ' me' : '') + (m.kind === 'bot' ? ' bot' : '');

  // 同一个人连续发言：不再重复名字，只留时间
  const sameThread = who === lastWho && (m.ts - lastTs) < 5 * 60 * 1000;
  el.className += sameThread ? '' : ' first';
  el.innerHTML = (sameThread ? '' : `<div class="who">${esc(who)}</div>`)
               + `<div class="body">${esc(m.text)}</div>`
               + `<div class="at">${clock(m.ts)}</div>`;

  const box = $('#msgs');
  const empty = box.querySelector('#emptyChat');
  if (empty) empty.remove();
  box.appendChild(el);
  box.scrollTop = box.scrollHeight;

  lastWho = who; lastTs = m.ts;
}

// ---------- AI ----------
async function loadCfg() {
  const r = await api(`/api/settings?token=${me.token}`);
  const lk = localStorage.getItem('aiq_key') || '';
  $('#baseUrl').value = localStorage.getItem('aiq_base') || r.baseUrl || '';
  $('#model').value = localStorage.getItem('aiq_model') || r.model || '';
  if (lk) $('#apiKey').value = lk;
  $('#apiKey').placeholder = (r.hasKey || lk) ? '已保存（留空不改）' : 'API Key（sk-...）';
}
$('#cfgBtn').onclick = () => {
  const el = $('#aiCfg');
  el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
};
$('#saveCfg').onclick = async () => {
  const key = $('#apiKey').value.trim();
  const base = $('#baseUrl').value.trim();
  const model = $('#model').value.trim();
  const r = await api('/api/settings', { token: me.token, apiKey: key, baseUrl: base, model });
  if (r.error) return alert(r.error);
  if (key) localStorage.setItem('aiq_key', key);
  if (base) localStorage.setItem('aiq_base', base);
  if (model) localStorage.setItem('aiq_model', model);
  await loadCfg();
  addAns('设置已保存');
};

function addAns(text, opts = {}) {
  const body = $('#aiBody');
  const hint = body.querySelector('#aiHint');
  if (hint) hint.remove();
  const last = body.querySelector('.ans:last-of-type');
  if (!opts.force && last && last.dataset.kind === 'sys' && last.textContent === text) return last;
  const el = document.createElement('div');
  el.className = 'ans';
  el.dataset.kind = opts.force ? 'reply' : 'sys';
  el.textContent = text;
  body.appendChild(el);
  body.scrollTop = body.scrollHeight;
  return el;
}

// 从主聊天框抓最近 n 条，拼成「谁: 内容」
function collectContext(n = 10) {
  const nodes = Array.from(document.querySelectorAll('#msgs .m')).slice(-n);
  return nodes.map(el => {
    const who = (el.querySelector('.who') || {}).textContent || lastWho || '某人';
    const text = (el.querySelector('.body') || {}).textContent || '';
    return `${who}: ${text}`;
  });
}

async function askAI(prompt) {
  if (!current) return addAns('先选个群');
  const p = prompt || $('#aiPrompt').value.trim();
  if (!p) return;

  const qEl = document.createElement('div');
  qEl.className = 'meq'; qEl.textContent = '我：' + p;
  $('#aiBody').appendChild(qEl);
  $('#aiPrompt').value = '';

  const ctx = collectContext(10);
  const last = addAns('…', { force: true });
  const r = await api('/api/ai', { token: me.token, groupId: current, prompt: p, lastSeq, context: ctx });
  last.textContent = r.error ? ('出错了：' + r.error) : r.text;
}

document.querySelectorAll('.q button').forEach(b => b.onclick = () => askAI(b.dataset.p));
$('#aiAsk').onclick = () => askAI();
$('#aiPrompt').addEventListener('keydown', e => { if (e.key === 'Enter') askAI(); });

$('#go').onclick = enter;
$('#name').addEventListener('keydown', e => { if (e.key === 'Enter') enter(); });
$('#createGroup').onclick = async () => {
  const name = $('#groupName').value.trim() || '新群';
  const r = await api('/api/groups', { token: me.token, name });
  if (r.error) return alert('建群失败：' + r.error);
  $('#groupName').value = '';
  await loadGroups();
  if (r.group) await openGroup(r.group.id, r.group.name);
};
$('#send').onclick = async () => {
  const t = $('#text').value.trim();
  if (!t || !current) return;
  $('#text').value = '';
  $('#text').style.height = 'auto';

  // /ai 开头：不发给群友，交给 AI，然后以「AI 助手」身份发到群里
  if (/^\/ai(\s|$)/.test(t)) {
    const prompt = t.replace(/^\/ai\s*/, '') || '总结一下大家刚才聊了什么';
    const r = await api('/api/ai/say', { token: me.token, groupId: current, prompt });
    if (r.error) addAns('出错了：' + r.error);
    return;
  }

  ws.send(JSON.stringify({ type:'send', groupId: current, text: t }));
};
$('#text').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#send').click(); }
});
$('#text').addEventListener('input', () => {
  const el = $('#text');
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 150) + 'px';
});

// 开发用：?as=名字 自动进入并打开第一个群（方便截图/联调）
const autoAs = new URLSearchParams(location.search).get('as');
if (autoAs) {
  $('#name').value = autoAs;
  enter().then(() => {
    const first = document.querySelector('#groups .g');
    if (first) first.click();
  });
}
</script>
</body>
</html>
