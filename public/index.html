<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIQ</title>
<style>
  :root { --bg:#111318; --panel:#181b22; --line:#262a33; --text:#e6e8ee; --dim:#8b93a7; --accent:#4c8dff; --ai:#8b6cff; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; background:var(--bg); color:var(--text);
         font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; display:flex; }
  #side { width:200px; border-right:1px solid var(--line); display:flex; flex-direction:column; background:var(--panel); }
  #side h1 { font-size:15px; margin:0; padding:14px 16px; border-bottom:1px solid var(--line); letter-spacing:1px; }
  #groups { flex:1; overflow:auto; }
  .g { padding:10px 16px; cursor:pointer; border-bottom:1px solid #1e222a; }
  .g:hover { background:#1e222a; } .g.active { background:#22304a; }
  .g small { color:var(--dim); display:block; }
  #newGroup { display:flex; gap:6px; padding:10px; border-top:1px solid var(--line); }
  input, button, textarea { font:inherit; }
  input, textarea { padding:8px 10px; border-radius:6px; border:1px solid var(--line); background:#0d0f13; color:var(--text); width:100%; }
  button { padding:8px 12px; border-radius:6px; border:0; background:var(--accent); color:#fff; cursor:pointer; }
  button.ghost { background:#242a35; } button:disabled { opacity:.5; }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }
  #head { padding:12px 18px; border-bottom:1px solid var(--line); color:var(--dim); }
  #msgs { flex:1; overflow:auto; padding:16px 18px; display:flex; flex-direction:column; gap:10px; }
  .m { max-width:72%; } .m .who { font-size:12px; color:var(--dim); margin-bottom:2px; }
  .m .bubble { background:#1e222a; padding:8px 12px; border-radius:10px; white-space:pre-wrap; word-break:break-word; }
  .m.me { align-self:flex-end; } .m.me .bubble { background:#24406b; }
  .m.bot .bubble { background:#2a2440; }
  #compose { display:flex; gap:8px; padding:12px 18px; border-top:1px solid var(--line); align-items:flex-end; }
  #compose textarea { flex:1; resize:none; max-height:140px; min-height:38px; background:rgba(13,15,19,.72);
                      backdrop-filter: blur(6px); border-radius:10px; padding:10px 12px; }
  #text::placeholder { color:#5c6478; }
  #ai { width:320px; border-left:1px solid var(--line); background:var(--panel); display:flex; flex-direction:column; }
  #ai header { padding:12px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  #ai header b { color:var(--ai); }
  #aiCfg { padding:12px 14px; display:none; flex-direction:column; gap:8px; border-bottom:1px solid var(--line); }
  #aiCfg input { font-size:13px; }
  #aiBody { flex:1; overflow:auto; padding:12px 14px; display:flex; flex-direction:column; gap:8px; }
  .q { display:flex; flex-wrap:wrap; gap:6px; padding:10px 14px; border-top:1px solid var(--line); }
  .q button { background:#242a35; font-size:12px; padding:6px 10px; }
  .ans { background:#1c1f27; border:1px solid #2a2f3a; border-radius:10px; padding:10px 12px; white-space:pre-wrap; }
  .meq { color:var(--dim); font-size:12px; text-align:right; }
  #login { position:fixed; inset:0; background:rgba(10,11,14,.94); display:flex; align-items:center; justify-content:center; }
  #login .box { width:320px; display:flex; flex-direction:column; gap:12px; }
  .hint { color:var(--dim); font-size:12px; }
</style>
</head>
<body>

<div id="side">
  <h1>AIQ</h1>
  <div id="groups"></div>
  <div id="newGroup" style="display:none">
    <input id="groupName" placeholder="新群名字">
    <button id="createGroup">建</button>
  </div>
</div>

<div id="main">
  <div id="head">未加入群</div>
  <div id="msgs"></div>
  <div id="compose" style="display:none">
    <textarea id="text" rows="1" placeholder="输入消息，或按 Shift+Enter 换行"></textarea>
    <button id="send">发送</button>
  </div>
</div>

<div id="ai">
  <header><b>AI</b><button id="cfgBtn" class="ghost" style="padding:4px 10px;font-size:12px">设置</button></header>
  <div id="aiCfg">
    <input id="apiKey" placeholder="API Key（sk-...）" type="password">
    <input id="baseUrl" placeholder="Base URL">
    <input id="model" placeholder="模型">
    <button id="saveCfg">保存</button>
    <div class="hint">key 只存在本机数据库，不上传</div>
  </div>
  <div id="aiBody"></div>
  <div class="q">
    <button data-p="总结一下大家刚才聊了什么">总结群聊</button>
    <button data-p="刚才谁说了什么，简单列一下">谁说了啥</button>
    <button data-p="帮我想一句自然的接话">帮接一句</button>
  </div>
  <div style="padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px">
    <input id="aiPrompt" placeholder="问 AI…">
    <button id="aiAsk">问</button>
  </div>
</div>

<div id="login">
  <div class="box">
    <h2 style="margin:0">进 AIQ</h2>
    <input id="name" placeholder="你的名字">
    <input id="server" placeholder="服务器地址（默认本机，局域网填 http://192.168.x.x:8090）">
    <button id="go">进去</button>
    <div class="hint" id="lanHint"></div>
    <div class="hint">token 存在本地；同一个服务器 = 同一个群</div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let me = null, ws = null, current = null, lastSeq = 0;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function api(path, body) {
  const r = await fetch(path, body ? { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) } : {});
  return r.json();
}

async function enter() {
  const name = $('#name').value.trim();
  if (!name) return;

  // 填了别的服务器地址：直接跳过去（同一个服务器 = 同一个群）
  const srv = $('#server').value.trim().replace(/\/+$/, '');
  if (srv && srv !== location.origin) {
    localStorage.setItem('aiq_server', srv);
    location.href = srv + '/';
    return;
  }

  const saved = localStorage.getItem('aiq_token');
  let u = saved ? await api('/api/login', { token: saved }) : null;
  if (!u || u.error) u = await api('/api/register', { name });
  if (u.error) { alert(u.error); return; }
  me = u; localStorage.setItem('aiq_token', u.token);
  $('#login').style.display = 'none';
  $('#newGroup').style.display = 'flex';
  await loadGroups(); await loadCfg(); connect();
}

async function showLan() {
  try {
    const r = await api('/api/net');
    $('#lanHint').textContent = r.ips && r.ips.length
      ? `局域网地址：http://${r.ips[0]}:${r.port}（让朋友填这个）`
      : '没检测到局域网 IP';
  } catch {}
}
showLan();
$('#server').value = localStorage.getItem('aiq_server') || '';

async function loadGroups() {
  const r = await api(`/api/groups?token=${me.token}`);
  const box = $('#groups'); box.innerHTML = '';
  (r.groups || []).forEach(g => {
    const el = document.createElement('div');
    el.className = 'g' + (current === g.id ? ' active' : '');
    el.innerHTML = `<div>${esc(g.name)}</div><small>${g.members} 人</small>`;
    el.onclick = () => openGroup(g.id, g.name);
    box.appendChild(el);
  });
}

function connect() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(`${proto}://${location.host}/ws?token=${me.token}`);
  ws.onopen = () => { if (current) ws.send(JSON.stringify({ type:'join', groupId: current })); };
  ws.onmessage = e => {
    const d = JSON.parse(e.data);
    if (d.type === 'joined') { lastSeq = d.lastSeq; pullHistory(); }
    if (d.type === 'msg' && d.groupId === current) render(d.message, d.fromName);
  };
  ws.onclose = () => setTimeout(connect, 1500);
}

async function openGroup(id, name) {
  current = id; lastSeq = 0;
  $('#head').textContent = name;
  $('#msgs').innerHTML = '';
  $('#compose').style.display = 'flex';
  await api('/api/join', { token: me.token, groupId: id });
  ws.send(JSON.stringify({ type:'join', groupId: id }));
  await pullHistory(); loadGroups();
}

async function pullHistory() {
  const r = await api(`/api/history?token=${me.token}&groupId=${current}&since=${lastSeq}`);
  (r.messages || []).forEach(m => render(m));
}

function render(m, fromName) {
  if (!m || m.seq <= lastSeq) return;
  lastSeq = m.seq;
  const el = document.createElement('div');
  const mine = m.from === me.id;
  el.className = 'm' + (mine ? ' me' : '') + (m.kind === 'bot' ? ' bot' : '');
  const who = m.from === 'ai-assistant' ? 'AI 助手'
            : (m.kind === 'bot' ? 'AI' : (mine ? me.name : (fromName || m.from)));
  el.innerHTML = `<div class="who">${esc(who)}</div><div class="bubble">${esc(m.text)}</div>`;
  $('#msgs').appendChild(el);
  $('#msgs').scrollTop = $('#msgs').scrollHeight;
}

// ---------- AI ----------
async function loadCfg() {
  const r = await api(`/api/settings?token=${me.token}`);
  const lk = localStorage.getItem('aiq_key') || '';
  $('#baseUrl').value = localStorage.getItem('aiq_base') || r.baseUrl || '';
  $('#model').value = localStorage.getItem('aiq_model') || r.model || '';
  if (lk) $('#apiKey').value = lk;
  $('#apiKey').placeholder = (r.hasKey || lk) ? '已保存（留空不改）' : 'API Key（sk-...）';
}
$('#cfgBtn').onclick = () => {
  const el = $('#aiCfg');
  el.style.display = el.style.display === 'flex' ? 'none' : 'flex';
};
$('#saveCfg').onclick = async () => {
  const key = $('#apiKey').value.trim();
  const base = $('#baseUrl').value.trim();
  const model = $('#model').value.trim();
  const r = await api('/api/settings', { token: me.token, apiKey: key, baseUrl: base, model });
  if (r.error) return alert(r.error);
  // 同时存本地一份，下次打开不用重填
  if (key) localStorage.setItem('aiq_key', key);
  if (base) localStorage.setItem('aiq_base', base);
  if (model) localStorage.setItem('aiq_model', model);
  await loadCfg();
  addAns('设置已保存（本机 + 浏览器各存一份）');
};

function addAns(text, opts = {}) {
  const body = $('#aiBody');
  const last = body.querySelector('.ans:last-of-type');
  // 连续两条一样的系统提示就不再插
  if (!opts.force && last && last.dataset.kind === 'sys' && last.textContent === text) return last;
  const el = document.createElement('div');
  el.className = 'ans';
  el.dataset.kind = opts.force ? 'reply' : 'sys';
  el.textContent = text;
  body.appendChild(el);
  body.scrollTop = body.scrollHeight;
  return el;
}

// 从主聊天框抓最近 n 条，拼成「谁: 内容」
function collectContext(n = 10) {
  const nodes = Array.from(document.querySelectorAll('#msgs .m')).slice(-n);
  return nodes.map(el => {
    const who = (el.querySelector('.who') || {}).textContent || '某人';
    const text = (el.querySelector('.bubble') || {}).textContent || '';
    return `${who}: ${text}`;
  });
}

async function askAI(prompt) {
  if (!current) return addAns('先选个群');
  const p = prompt || $('#aiPrompt').value.trim();
  if (!p) return;

  const qEl = document.createElement('div');
  qEl.className = 'meq'; qEl.textContent = '我：' + p;
  $('#aiBody').appendChild(qEl);
  $('#aiPrompt').value = '';

  const ctx = collectContext(10);
  const last = addAns('…', { force: true });
  const r = await api('/api/ai', { token: me.token, groupId: current, prompt: p, lastSeq, context: ctx });
  last.textContent = r.error ? ('出错了：' + r.error) : r.text;
}

document.querySelectorAll('.q button').forEach(b => b.onclick = () => askAI(b.dataset.p));
$('#aiAsk').onclick = () => askAI();
$('#aiPrompt').addEventListener('keydown', e => { if (e.key === 'Enter') askAI(); });

$('#go').onclick = enter;
$('#name').addEventListener('keydown', e => { if (e.key === 'Enter') enter(); });
$('#createGroup').onclick = async () => {
  const name = $('#groupName').value.trim() || '新群';
  const r = await api('/api/groups', { token: me.token, name });
  if (r.error) return alert('建群失败：' + r.error);
  $('#groupName').value = '';
  await loadGroups();
  if (r.group) await openGroup(r.group.id, r.group.name);
};
$('#send').onclick = async () => {
  const t = $('#text').value.trim();
  if (!t || !current) return;
  $('#text').value = '';
  $('#text').style.height = 'auto';

  // /ai 开头：不发给群友，交给 AI，然后以「AI 助手」身份发到群里
  if (/^\/ai(\s|$)/.test(t)) {
    const prompt = t.replace(/^\/ai\s*/, '') || '总结一下大家刚才聊了什么';
    const r = await api('/api/ai/say', { token: me.token, groupId: current, prompt });
    if (r.error) addAns('出错了：' + r.error);
    return;
  }

  ws.send(JSON.stringify({ type:'send', groupId: current, text: t }));
};
$('#text').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('#send').click(); }
});
$('#text').addEventListener('input', () => {
  const el = $('#text');
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
});
</script>
</body>
</html>
